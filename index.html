<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10291f"><style>img{max-width:100%}[hidden]{display:none!important}</style>
<title>생일선물</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* VOICE occasion, warm and silly: a gift from one friend to another
   IDEA a red bakery advent box: each door is a wrapped treat window with its date on it
   PICTURE a snowy night street with a little bakery and a tree whose star is the secret preview switch
   COLOUR pine night ground, cream paper, christmas red, gold for today and numbers
   TYPE Jua (round, hand-made lettering) + Gowun Dodum
   LAYOUT one phone column: scene band, today line, 4x6 door box, bottom sheet for opened doors */
:root{color-scheme:dark;--bg:#10291f;--bg2:#173a2c;--ink:#fff6e8;--soft:#cfe0d4;--red:#d63b2f;--red2:#a9261f;--cream:#fff3dc;--cream2:#f3dfbd;--gold:#f4bd4f;--brown:#4a2a1a;--todo:#ffe36e}
*{box-sizing:border-box;min-width:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Gowun Dodum",system-ui,sans-serif;overflow-x:clip;margin:0}
h1,h2,h3,.num,.btn,.jua{font-family:Jua,"Gowun Dodum",sans-serif;font-weight:400}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scene{position:relative;height:250px;max-width:560px;margin:0 auto;overflow:hidden}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.flake{animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(270px)}}
@media(prefers-reduced-motion:reduce){.flake{animation:none}.door.today{animation:none!important}}
.head{padding-block:18px 6px}
.head h1{font-size:clamp(32px,9vw,44px);line-height:1.08;letter-spacing:-.02em;margin:0}
.head p{margin:8px 0 0;color:var(--soft)}
.status{margin:14px 0 18px;background:var(--bg2);border-radius:16px;padding:12px 16px;display:flex;gap:12px;align-items:center}
.status b{font-family:Jua,sans-serif;font-weight:400;font-size:26px;color:var(--gold);white-space:nowrap}
.status span{color:var(--soft);font-size:15px}
.box{background:var(--red);border-radius:22px;padding:12px;box-shadow:inset 0 0 0 3px var(--red2),0 8px 0 var(--red2);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:30px}
.door{position:relative;aspect-ratio:1/1.12;border:0;border-radius:14px;cursor:pointer;font:inherit;color:var(--brown);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.door:active{transform:scale(.94)}
.door .num{font-size:clamp(26px,8vw,36px);line-height:1;position:relative;z-index:1}
.door .mon{font-size:11px;position:relative;z-index:1;opacity:.8}
.door.c0{background:var(--cream)}
.door.c1{background:#2f7a52;color:var(--cream)}
.door.c2{background:var(--cream2)}
.door.c3{background:#f08a5d;color:#3a1a10}
.door::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:7px;margin-left:-3.5px;background:rgba(214,59,47,.28)}
.door::after{content:"";position:absolute;top:50%;left:0;right:0;height:7px;margin-top:-3.5px;background:rgba(214,59,47,.28)}
.door.c1::before,.door.c1::after{background:rgba(255,243,220,.22)}
.door.locked .num{opacity:.55}
.lock{position:absolute;right:6px;bottom:6px;width:14px;height:14px;z-index:1;opacity:.55}
.door.today{box-shadow:0 0 0 3px var(--gold);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.door.opened{background:var(--bg2)!important;color:var(--gold)}
.door.opened::before,.door.opened::after{display:none}
.door.opened .mon{color:var(--soft)}
.door.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px) rotate(-3deg)}75%{transform:translateX(5px) rotate(3deg)}}
.foot{color:var(--soft);font-size:14px;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));text-align:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--cream);color:var(--brown);padding:12px 18px;border-radius:14px;font-size:15px;width:max-content;max-width:calc(100% - 32px);transition:.25s;z-index:30;pointer-events:none;box-shadow:0 4px 0 var(--cream2)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.veil{position:fixed;inset:0;background:rgba(5,15,10,.6);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88svh;overflow-y:auto;background:var(--cream);color:#2b1a12;border-radius:24px 24px 0 0;padding:22px max(20px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:25}
.sheet.on{transform:none}
.sheet .x{position:absolute;right:14px;top:12px;width:44px;height:44px;border:0;border-radius:50%;background:var(--cream2);font-size:22px;color:#2b1a12;cursor:pointer}
.sheet .date{color:var(--red);font-family:Jua,sans-serif;font-size:17px}
.sheet h2{font-size:30px;line-height:1.15;margin:2px 0 14px;letter-spacing:-.02em;padding-right:44px}
.sheet p{margin:0 0 12px;font-size:17px}
mark.todo{background:var(--todo);color:#2b1a12;padding:1px 4px;border-radius:4px}
.letter{background:#fffaf0;border-radius:14px;padding:18px;background-image:repeating-linear-gradient(transparent 0 31px,#f0dfc4 31px 32px);line-height:32px;font-size:17px}
.letter p{line-height:32px;margin:0 0 0}
.letter .sign{text-align:right;font-family:Jua,sans-serif;margin-top:8px}
.ticket{display:grid;grid-template-columns:1fr auto;background:var(--red);color:var(--cream);border-radius:16px;overflow:hidden}
.ticket .l{padding:16px 18px}
.ticket .l b{font-family:Jua,sans-serif;font-weight:400;font-size:24px;display:block;line-height:1.2}
.ticket .r{border-left:3px dashed var(--cream);padding:16px 14px;display:flex;align-items:center;font-family:Jua,sans-serif;font-size:18px;writing-mode:vertical-rl}
.ticket.green{background:#2f7a52}
.fine{font-size:14px;opacity:.85;margin-top:6px}
.imgslot{margin-top:14px;border:3px dashed #d9bf96;border-radius:14px;padding:22px 14px;text-align:center;color:#8a6a4a;font-size:15px}
.imgslot svg{display:block;margin:0 auto 8px}
.gimg{width:100%;border-radius:14px;margin-top:14px;display:block}
.polaroid{background:#fff;padding:12px 12px 16px;border-radius:6px;box-shadow:0 3px 0 #e4cfae;transform:rotate(-1.5deg);margin:6px 4px 16px}
.polaroid .ph{aspect-ratio:4/3;background:#e9dcc6;border-radius:3px;display:flex;align-items:center;justify-content:center;color:#8a6a4a;text-align:center;padding:10px;overflow:hidden}
.polaroid .ph img{width:100%;height:100%;object-fit:cover}
.polaroid .cap{font-family:Jua,sans-serif;margin-top:10px;font-size:18px;text-align:center}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:14px;background:var(--red);color:var(--cream);font-size:19px;cursor:pointer;margin-top:10px}
.btn:active{background:var(--red2)}
.opt{display:block;width:100%;text-align:left;min-height:50px;border:2px solid var(--cream2);background:#fff;border-radius:14px;padding:10px 14px;font:17px "Gowun Dodum",sans-serif;color:#2b1a12;margin-top:8px;cursor:pointer}
.opt.right{border-color:#2f7a52;background:#e2f3e8}
.opt.wrong{border-color:var(--red);background:#fbe3df}
.answer{margin-top:14px;font-size:17px;min-height:1em}
.big{font-family:Jua,sans-serif;font-size:26px;line-height:1.3;background:#fff;border-radius:16px;padding:20px;text-align:center;margin:6px 0 4px;color:var(--red)}
.chk{display:flex;gap:12px;align-items:center;min-height:48px;border-bottom:1px solid var(--cream2);cursor:pointer;font-size:17px}
.chk input{width:22px;height:22px;accent-color:var(--red);flex:none}
.banner{position:relative;display:block;width:100%;border:0;border-radius:20px;background:var(--red);color:var(--cream);padding:26px 18px;text-align:center;cursor:pointer;font-family:Jua,sans-serif;font-size:clamp(24px,7vw,30px);line-height:1.25;box-shadow:0 6px 0 var(--red2)}
.banner small{display:block;font-size:16px;opacity:.85;margin-top:6px}
.banner:active{transform:translateY(3px);box-shadow:0 3px 0 var(--red2)}
.hint{font-family:Jua,sans-serif;font-size:20px;color:var(--red);text-align:center;margin:0 0 10px;opacity:0;transform:translateY(6px);transition:.4s}
.hint.on{opacity:1;transform:none;animation:nudge 1.2s ease-in-out .4s infinite}
@keyframes nudge{50%{transform:translateY(-4px)}}
.stage{text-align:center;position:relative}
.loud{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;font:clamp(84px,26vw,130px)/1.02 Jua,sans-serif;color:#d63b2f;background:rgba(255,243,220,.92);border-radius:18px;-webkit-text-stroke:2px #a9261f;transition:opacity .35s;animation:pulse .7s ease-in-out infinite alternate}
.loud.off{opacity:0;pointer-events:none}
@keyframes pulse{to{transform:scale(1.06)}}
.rec{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:2;background:rgba(43,26,18,.75);color:#fff;font:14px/1 Jua,sans-serif;padding:6px 10px 6px 8px;border-radius:99px;display:flex;gap:6px;align-items:center}
.rec i{width:10px;height:10px;border-radius:50%;background:#ff3b30;animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.down{animation:nudge 1.2s ease-in-out infinite}
.cam{position:relative;width:min(64vw,250px);aspect-ratio:1;margin:0 auto;border-radius:50%;overflow:hidden;background:#e9dcc6;box-shadow:0 0 0 6px #fff,0 0 0 10px var(--gold)}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.cam .nocam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8a6a4a;font-size:14px;padding:20px}
.cake{display:block;width:min(78vw,300px);margin:-8px auto 0}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .35s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
.flame.out{animation:none;opacity:0;transition:opacity .25s}
.smoke{opacity:0}
.smoke.on{animation:smoke 1.6s ease-out forwards}
@keyframes smoke{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-26px)}}
.say{font-family:Jua,sans-serif;font-size:22px;line-height:1.3;margin:12px 0 6px;min-height:1.3em;color:#2b1a12}
.meter{height:10px;border-radius:5px;background:var(--cream2);overflow:hidden;margin:8px auto 0;max-width:260px}
.meter i{display:block;height:100%;width:0;background:var(--red);transition:width .08s}
.small{font-size:14px;color:#8a6a4a}
@media(prefers-reduced-motion:reduce){.flame,.hint.on{animation:none}}
.prev{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--gold);color:var(--brown);text-align:center;font-size:14px;padding:6px 16px}
</style>

</head><body>

<div class="wrap">
<header class="head">
<h1 id="title">너만을 위한<br>캘린더</h1>
<p id="sub">생일선물 미루던 너에게, 크리스마스까지 하루에 하나씩.</p>

<script>
{
/* ===== 여기만 바꾸면 돼요 ===== */
const YEAR = 2026;
const FROM = '여울';
const SIGN = '여울이가';
/* 12월 2일 생일축하송: 여울이 목소리 파일이 오면 여기에 넣음. 비어 있으면 임시 멜로디가 나와요 */
const SONG_SRC = 'song.m4a';
/* 각 문 내용. d = 12월 며칠. t = 종류(letter 편지, gift 기프티콘, coupon 쿠폰, photo 사진, quiz 퀴즈, fortune 운세, list 체크리스트) */
const DOORS = [
{d:2,t:'song',title:'생일 축하해'},
{d:3,t:'gift',title:'출근길 수혈',item:'아이스 아메리카노',shop:'메가커피',price:2000,img:null,note:'추워도 아아 마시는 거 알아.'},
{d:4,t:'quiz',title:'먹보 퀴즈 1',q:'우리가 처음으로 같이 먹은 음식은?',opts:['<mark class="todo">정답 메뉴</mark>','떡볶이','마라탕','기억 안 남 (서운함)'],a:0,right:'정답! 역시 먹은 건 안 잊어버리는 사람.',wrong:'땡. 이건 좀 서운하다.'},
{d:5,t:'coupon',title:'붕어빵 쿠폰',item:'붕어빵 3마리 사줌',fine:'사용법: 붕어빵 트럭 보이면 나한테 사진 보내기. 팥/슈크림 선택 가능.',color:'red'},
{d:6,t:'photo',title:'우리 사진 하나',img:null,caption:'이때 기억나?',body:['<mark class="todo">이 사진에 얽힌 이야기 한두 줄</mark>']},
{d:7,t:'fortune',title:'오늘의 먹운세',list:['오늘은 국물 요리가 운을 부른다. 특히 뼈해장국.','점심에 고민되면 무조건 첫 번째로 떠오른 메뉴. 그게 운명.','야식 금지운... 은 아니고 야식 대길.','디저트를 먹으면 좋은 소식이 온다. 안 와도 디저트는 맛있다.','오늘 누가 밥 사준다고 하면 거절하지 말 것. 그게 나일 수도.','편의점 신상을 고르면 대박 아니면 쪽박. 도전해봐.']},
{d:8,t:'gift',title:'바나나맛 위로',item:'바나나맛 우유',shop:'편의점',price:1700,img:null,note:'노란 거 마시고 기분도 노랗게.'},
{d:9,t:'letter',title:'너의 좋은 점 3가지',body:['1. <mark class="todo">좋은 점 하나</mark>','2. <mark class="todo">좋은 점 둘</mark>','3. 맛있는 거 먹을 때 진짜 행복해 보임. 그거 보는 재미가 있음.']},
{d:10,t:'coupon',title:'메뉴 결정권',item:'메뉴 고를 때 군말 없이 따라가기',fine:'"아무거나"라고 하면 쿠폰 소멸. 정확한 메뉴명 필수.',color:'green'},
{d:11,t:'letter',title:'너를 음식으로 표현하면',body:['붕어빵. 겉은 바삭하게 툴툴대는데 속은 따뜻하고 달달함.','<mark class="todo">(바꾸고 싶으면 다른 음식으로)</mark>','아무튼 추울 때 생각나는 사람이라는 뜻.']},

const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let offset=0, ready=false, preview=store.get('adv-preview')==='1';
let opened=new Set((store.get('adv-opened')||'').split(',').filter(Boolean).map(Number));

/* 한국 시간 기준 오늘 날짜 */
function kst(){const k=new Date(Date.now()+offset+9*3600e3);return{y:k.getUTCFullYear(),m:k.getUTCMonth()+1,d:k.getUTCDate()}}
function isOpen(d){if(preview)return true;const t=kst();return t.y>YEAR||(t.y===YEAR&&t.m===12&&t.d>=d)}
function daysUntil(d){const t=kst();const a=Date.UTC(t.y,t.m-1,t.d),b=Date.UTC(YEAR,11,d);return Math.round((b-a)/864e5)}

/* 폰 시계를 바꿔도 안 열리게, 가능하면 서버 시간을 씀 */
async function syncTime(){
  try{const c=new AbortController();const tm=setTimeout(()=>c.abort(),3000);
    const r=await fetch(location.href,{method:'HEAD',cache:'no-store',signal:c.signal});clearTimeout(tm);
    const h=r.headers.get('date');const s=h?Date.parse(h):NaN;if(!isNaN(s))offset=s-Date.now();
  }catch(e){}
  ready=true;render();
}

const lockSvg='<svg class="lock" viewBox="0 0 14 14"><rect x="2" y="6" width="10" height="7" rx="2" fill="currentColor"/><path d="M4.5 6V4.5a2.5 2.5 0 0 1 5 0V6" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>';
function render(){
  $('prev').hidden=!preview;
  const t=kst();
  $('box').innerHTML=DOORS.map((x,i)=>{
    const open=ready&&isOpen(x.d), today=ready&&t.y===YEAR&&t.m===12&&t.d===x.d;
    const cls=['door','c'+((i*3+Math.floor(i/4))%4),open?'':'locked',today?'today':'',opened.has(x.d)?'opened':''].join(' ');
    return `<button class="${cls}" data-d="${x.d}" aria-label="12월 ${x.d}일${open?'':' (잠김)'}"><span class="mon">12월</span><span class="num">${x.d}</span>${open?'':lockSvg}</button>`;
  }).join('');
  const st=$('status');
  if(!ready){st.innerHTML='<b>…</b><span>시간 확인 중</span>';return}
  const first=daysUntil(2), last=daysUntil(25);
  if(first>0) st.innerHTML=`<b>D-${first}</b><span>12월 2일에 첫 번째 문이 열려. 조금만 기다려.</span>`;
  else if(last>0){const n=DOORS.filter(x=>isOpen(x.d)&&!opened.has(x.d)).length;st.innerHTML=`<b>${t.m===12?t.d+'일':''}</b><span>${n?`안 연 문이 ${n}개 있어. 반짝이는 게 오늘 거.`:'오늘 거 열었네. 내일 또 와.'} 크리스마스까지 ${last}일.</span>`}
  else st.innerHTML='<b>메리 크리스마스</b><span>모든 문이 열렸어. 다시 봐도 돼.</span>';
}

/* ===== 12월 2일: 생일축하송 ===== */
const song=(()=>{
  const W=720,H=960,CX=360,CY=300,R=240;
  let timers=[],cam=null,mic=null,ac=null,audio=null,raf=0,live=false;
  let cv,ctx,vid,selfie=null,dest=null,rec=null,chunks=[],lit=[1,1,1],smoke=[],parts=[],rockets=[],done=false,t0=0;
  const later=(f,ms)=>timers.push(setTimeout(f,ms));
  const CAND=[290,360,430],CCOL=['#f4bd4f','#7fc4a0','#f08a5d'];

  function start(){
    stop();live=true;done=false;lit=[1,1,1];smoke=[];parts=[];rockets=[];selfie=null;
    $('banner').onclick=play;
  }

  /* ---- 그리기 (화면에 보이는 것 = 녹화되는 것) ---- */
  function rr(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fill()}
  function scallop(x0,x1,y,r,c){ctx.fillStyle=c;for(let x=x0+r;x<=x1-r+1;x+=r*2){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI);ctx.fill()}}
  function dots(list,c){ctx.fillStyle=c;list.forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill()})}
  function draw(now){
    if(!live)return;
    const t=(now-t0)/1000;
    ctx.fillStyle='#fff3dc';ctx.fillRect(0,0,W,H);
    /* 얼굴 원 */
    ctx.save();ctx.beginPath();ctx.arc(CX,CY,R,0,7);ctx.closePath();ctx.fillStyle='#e9dcc6';ctx.fill();ctx.clip();
    const src=(vid&&vid.readyState>=2&&vid.videoWidth)?vid:(selfie&&selfie.complete&&selfie.naturalWidth?selfie:null);
    if(src){const sw=src.videoWidth||src.naturalWidth,sh=src.videoHeight||src.naturalHeight,s=Math.min(sw,sh);
      ctx.translate(CX,0);ctx.scale(-1,1);ctx.translate(-CX,0);
      ctx.drawImage(src,(sw-s)/2,(sh-s)/2,s,s,CX-R,CY-R,R*2,R*2);}
    else{ctx.fillStyle='#d9bf96';ctx.beginPath();ctx.arc(CX,CY-40,70,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(CX,CY+170,150,110,0,Math.PI,0);ctx.fill()}
    ctx.restore();
    ctx.lineWidth=14;ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(CX,CY,R+7,0,7);ctx.stroke();
    ctx.lineWidth=10;ctx.strokeStyle='#f4bd4f';ctx.beginPath();ctx.arc(CX,CY+0,R+18,0,7);ctx.stroke();
    /* 케이크 */
    ctx.fillStyle='#e4cfae';ctx.beginPath();ctx.ellipse(CX,915,300,26,0,0,7);ctx.fill();
    rr(140,770,440,140,22,'#f7c6c7');rr(140,770,440,26,13,'#fff6e8');scallop(140,580,792,20,'#fff6e8');
    rr(220,680,280,100,18,'#fff6e8');rr(220,680,280,22,11,'#d63b2f');scallop(220,500,700,20,'#d63b2f');
    dots([[280,745],[360,750],[440,745]],'#d63b2f');dots([[190,850],[300,858],[420,858],[530,850]],'#2f7a52');
    CAND.forEach((x,i)=>{rr(x-10,590,20,92,6,CCOL[i]);ctx.strokeStyle='#fff';ctx.lineWidth=4;for(let y=605;y<675;y+=22){ctx.beginPath();ctx.moveTo(x-10,y+8);ctx.lineTo(x+10,y);ctx.stroke()}
      if(lit[i]){const f=1+Math.sin(t*18+i*2)*.08,sw=Math.sin(t*11+i)*.08;
        ctx.save();ctx.translate(x,588);ctx.rotate(sw);ctx.scale(1/f,f);
        const g=ctx.createRadialGradient(0,-20,2,0,-20,60);g.addColorStop(0,'rgba(255,210,90,.45)');g.addColorStop(1,'rgba(255,210,90,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-20,60,0,7);ctx.fill();
        ctx.fillStyle='#ffb53b';ctx.beginPath();ctx.moveTo(0,-62);ctx.bezierCurveTo(22,-34,22,-6,0,-2);ctx.bezierCurveTo(-22,-6,-22,-34,0,-62);ctx.fill();
        ctx.fillStyle='#fff3c4';ctx.beginPath();ctx.moveTo(0,-36);ctx.bezierCurveTo(10,-22,10,-8,0,-6);ctx.bezierCurveTo(-10,-8,-10,-22,0,-36);ctx.fill();ctx.restore()}});
    smoke=smoke.filter(s=>t-s.t<1.8);smoke.forEach(s=>{const k=(t-s.t)/1.8;ctx.fillStyle=`rgba(190,180,165,${.6*(1-k)})`;ctx.beginPath();ctx.arc(s.x+Math.sin(k*6)*10,575-k*90,12+k*16,0,7);ctx.fill()});
    /* 폭죽: 아래에서 얼굴 쪽으로 날아가서 터짐 */
    rockets=rockets.filter(r=>{if(t<r.t)return true;const k=Math.min(1,(t-r.t)/r.d);const x=r.x0+(r.x1-r.x0)*k,y=r.y0+(r.y1-r.y0)*(1-(1-k)*(1-k));
      ctx.fillStyle=r.c;ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill();ctx.fillStyle='rgba(255,220,120,.5)';ctx.beginPath();ctx.arc(x,y+16,5,0,7);ctx.fill();
      if(k>=1){burst(r.x1,r.y1,r.c,t);return false}return true});
    parts=parts.filter(p=>{const a=t-p.t;if(a>p.life)return false;const x=p.x+p.vx*a,y=p.y+p.vy*a+260*a*a;
      ctx.globalAlpha=Math.max(0,1-a/p.life);ctx.fillStyle=p.c;
      if(p.sq){ctx.save();ctx.translate(x,y);ctx.rotate(a*8+p.vx);ctx.fillRect(-7,-4,14,8);ctx.restore()}else{ctx.beginPath();ctx.arc(x,y,p.r,0,7);ctx.fill()}
      ctx.globalAlpha=1;return true});
    if(done){ctx.font='54px Jua, sans-serif';ctx.textAlign='center';ctx.lineWidth=14;ctx.strokeStyle='#fff3dc';ctx.strokeText('생일 축하해 유림아!',CX,586);ctx.fillStyle='#d63b2f';ctx.fillText('생일 축하해 유림아!',CX,586)}
    raf=requestAnimationFrame(draw);
  }
  const FW=['#d63b2f','#f4bd4f','#2f7a52','#f08a5d','#7fc4a0','#ff6fa8','#ffffff'];
  function burst(x,y,c,t){
    for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,v=120+Math.random()*320;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,t,life:1+Math.random()*.9,c:Math.random()<.6?c:FW[i%FW.length],r:3+Math.random()*4,sq:Math.random()<.3})}
    pop();
  }
  function fireworks(){
    const t=(performance.now()-t0)/1000;
    for(let i=0;i<7;i++){const ang=-Math.PI/2+(Math.random()-.5)*Math.PI*1.3,rad=R*(.7+Math.random()*.5);
      const fromLeft=i%2===0;rockets.push({t:t+i*.38,x0:fromLeft?40+Math.random()*80:W-40-Math.random()*80,y0:H-20,x1:CX+Math.cos(ang)*rad,y1:CY+Math.sin(ang)*rad,d:.55+Math.random()*.2,c:FW[i%FW.length]})}
  }
  /* 폭죽 소리 */
  function pop(){if(!ac)return;try{const n=ac.sampleRate*.4,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
    const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;g.gain.value=.5;s.buffer=b;s.connect(f).connect(g);g.connect(ac.destination);if(dest)g.connect(dest);s.start()}catch(e){}}

  /* 임시 멜로디 (여울이 목소리 오기 전까지) */
  function melody(){
    const N={G4:392,A4:440,B4:493.9,C5:523.3,D5:587.3,E5:659.3,F5:698.5,G5:784};
    const seq=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2.5]];
    const beat=.42;let t=ac.currentTime+.15;
    seq.forEach(([n,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=N[n];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d*beat*.95);o.connect(g);g.connect(ac.destination);if(dest)g.connect(dest);o.start(t);o.stop(t+d*beat);t+=d*beat});
    return (t-ac.currentTime)*1000;
  }

  /* ---- 녹화 ---- */
  function startRec(){
    try{
      if(!cv.captureStream||!window.MediaRecorder)return;
      const tracks=[...cv.captureStream(30).getVideoTracks(),...(dest?dest.stream.getAudioTracks():[])];
      const type=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';
      rec=new MediaRecorder(new MediaStream(tracks),type?{mimeType:type}:undefined);chunks=[];
      rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
      rec.onstop=saved;rec.start(1000);$('rec').hidden=false;
    }catch(e){rec=null}
  }
  function saved(){
    const rb=$('rec');if(rb)rb.hidden=true;
    if(!chunks.length)return;
    const type=rec.mimeType||chunks[0].type||'video/mp4',ext=type.includes('mp4')?'mp4':'webm';
    const blob=new Blob(chunks,{type}),url=URL.createObjectURL(blob),name='유림이_생일축하.'+ext;
    const box=document.createElement('div');box.id='recbox';
    box.innerHTML=`<p class="say" style="font-size:30px;color:#d63b2f;margin-top:20px">니 방금 녹화됨<br>밑에 내려보셈ㅋㅋㄹㅋ</p><svg width="34" height="40" viewBox="0 0 34 40" style="display:block;margin:6px auto 14px" class="down"><path d="M17 2v32M4 22l13 14 13-14" stroke="#d63b2f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><video id="playback" src="${url}" controls playsinline style="width:100%;border-radius:14px;background:#000"></video><button class="btn" id="share">영상 저장하기 / 보내기</button><a class="btn" id="dl" href="${url}" download="${name}" style="display:flex;align-items:center;justify-content:center;text-decoration:none" hidden>영상 다운로드</a>`;
    $('sheetBody').querySelector('.stage').appendChild(box);
    const file=new File([blob],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]}))$('share').onclick=()=>navigator.share({files:[file],title:'유림이 생일축하'}).catch(()=>{});
    else{$('share').hidden=true;$('dl').hidden=false}
  }

  async function play(){
    /* 버튼 누른 순간에 소리를 깨워둬야 아이폰이 허락해줌 */
    try{ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume();dest=ac.createMediaStreamDestination()}catch(e){}
    if(SONG_SRC){audio=new Audio(SONG_SRC);audio.playsInline=true;audio.preload='auto';audio.play().then(()=>audio.pause()).catch(()=>{});
      try{const n=ac.createMediaElementSource(audio);n.connect(ac.destination);n.connect(dest)}catch(e){}}
    $('sheetBody').querySelector('h2').textContent='생일 축하해, 유림아';
    const host=$('banner').parentNode;$('banner').remove();
    const st=document.createElement('div');st.className='stage';
    st.innerHTML=`<div class="loud" id="loud">소리<br>키셈</div><div class="rec" id="rec" hidden><i></i>REC</div><canvas id="cv" width="${W}" height="${H}" style="width:100%;max-width:360px;display:block;margin:0 auto;border-radius:18px"></canvas><video id="vid" playsinline autoplay muted style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video><div class="say" id="say">카메라 켜는 중…</div><div class="meter" id="meter" hidden><i id="bar"></i></div><p class="small" id="tip"></p>`;
    host.appendChild(st);
    const shown=performance.now();
    cv=$('cv');ctx=cv.getContext('2d');vid=$('vid');t0=performance.now();raf=requestAnimationFrame(draw);
    try{
      cam=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:720}},audio:false});
      if(!live)return stop();
      vid.srcObject=cam;await vid.play().catch(()=>{});
    }catch(e){
      $('tip').innerHTML='카메라를 못 켰어. <label style="color:#d63b2f;text-decoration:underline;cursor:pointer">셀카 찍어서 넣기<input type="file" accept="image/*" capture="user" id="selfie" hidden></label>';
      $('selfie').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;selfie=new Image();selfie.src=URL.createObjectURL(f);$('tip').textContent=''};
    }
    if(!live)return;
    /* "소리키셈"을 최소 1.5초는 보여주고 시작 */
    const wait=1500-(performance.now()-shown);if(wait>0)await new Promise(r=>later(r,wait));
    if(!live)return;
    $('loud').classList.add('off');
    $('say').textContent='노래 듣는 중…';
    /* 노래 시작 = 녹화 시작 */
    startRec();
    let ms=0;
    if(audio){audio.currentTime=0;audio.play().catch(()=>{});
      ms=await new Promise(r=>{audio.addEventListener('ended',()=>r(0));audio.addEventListener('error',()=>r(1000));later(()=>r(isFinite(audio.duration)?Math.max(0,(audio.duration-audio.currentTime)*1000):60000),1500)});}
    else if(ac){ms=melody()} else ms=8000;
    later(blowTime,ms+400);
  }

  async function blowTime(){
    if(!live)return;
    $('say').textContent='케이크 촛불 끄게 후 불어';
    let power=0;const need=900; /* 0.9초 정도 불면 다 꺼짐 */
    const blowOut=amt=>{if(power>=need)return;power=Math.min(need,power+amt);const k=Math.floor(power/(need/3)+1e-9);
      for(let i=0;i<3;i++)if(i<k&&lit[i]){lit[i]=0;smoke.push({x:CAND[i],t:(performance.now()-t0)/1000})}
      $('bar').style.width=(power/need*100)+'%';if(power>=need)win()};
    /* 마이크가 안 되면 촛불을 톡 치면 꺼짐 */
    const tapMode=msg=>{$('tip').textContent=msg;cv.onclick=()=>blowOut(need/3+1)};
    try{
      mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      if(!live)return stop();
      await ac.resume();
      const ms=ac.createMediaStreamSource(mic),an=ac.createAnalyser();an.fftSize=1024;ms.connect(an);if(dest)ms.connect(dest);
      const buf=new Float32Array(an.fftSize);let last=performance.now();
      $('meter').hidden=false;$('tip').textContent='폰 아래쪽 마이크에 대고 후~';
      const loop=now=>{if(!live||power>=need)return;an.getFloatTimeDomainData(buf);let sum=0;for(const v of buf)sum+=v*v;const rms=Math.sqrt(sum/buf.length);
        const dt=now-last;last=now;if(rms>0.1)blowOut(dt);requestAnimationFrame(loop)};
      requestAnimationFrame(loop);
      later(()=>{if(power<need)tapMode('잘 안 꺼지면 촛불을 손가락으로 톡 쳐도 돼')},15000);
    }catch(e){tapMode('마이크를 못 켜서… 촛불을 손가락으로 톡톡 쳐서 꺼줘')}
  }

  function win(){
    $('meter').hidden=true;$('tip').textContent='';$('say').textContent='후~ 소원 빌었지?';
    later(()=>{done=true;fireworks()},500);
    /* 폭죽 다 터지면 녹화 끝 */
    later(()=>{if(mic){mic.getTracks().forEach(t=>t.stop());mic=null}if(rec&&rec.state!=='inactive')rec.stop()},500+7*380+700+2200);
  }

  function stop(){
    live=false;timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);
    if(rec&&rec.state!=='inactive'){rec.onstop=null;try{rec.stop()}catch(e){}}rec=null;
    [cam,mic].forEach(s=>s&&s.getTracks().forEach(t=>t.stop()));cam=mic=null;
    if(audio){audio.pause();audio=null}
    if(ac){try{ac.close()}catch(e){}ac=null}dest=null;
  }
  return{start,stop};
})();

function openDoor(d){
  const x=DOORS.find(o=>o.d===d);
  $('sheetBody').innerHTML=`<div class="date">12월 ${d}일${x.final?' · 마지막 문':''}</div><h2>${x.title}</h2>${body(x)}`;
  $('sheet').classList.add('on');$('veil').classList.add('on');
  if(!preview&&!opened.has(d)){opened.add(d);store.set('adv-opened',[...opened].join(','));}
  if(x.t==='song')song.start();
  if(x.t==='quiz')$('sheetBody').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;b.classList.add(i===x.a?'right':'wrong');$('ans').textContent=i===x.a?x.right:x.wrong});
  if(x.t==='fortune')$('draw').onclick=()=>{$('fort').textContent=x.list[Math.floor(Math.random()*x.list.length)]};
  if(x.t==='list'){const k='adv-list-'+d,saved=(store.get(k)||'').split(',');$('sheetBody').querySelectorAll('input').forEach(c=>{c.checked=saved.includes(c.dataset.i);c.onchange=()=>store.set(k,[...$('sheetBody').querySelectorAll('input:checked')].map(e=>e.dataset.i).join(','))})}
}
function closeSheet(){song.stop();$('sheet').classList.remove('on');$('veil').classList.remove('on');render()}
$('x').onclick=closeSheet;$('veil').onclick=closeSheet;

$('box').addEventListener('click',e=>{
  const b=e.target.closest('.door');if(!b||!ready)return;const d=+b.dataset.d;
  if(isOpen(d)){openDoor(d);return}
  b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
  const n=daysUntil(d);toast(LOCKED_LINES[Math.floor(Math.random()*LOCKED_LINES.length)].replace('{d}',d).replace('{n}',n));
});

/* 비밀 미리보기: 트리 꼭대기 별 7번 */
let taps=0,tapT;
$('star').addEventListener('click',()=>{taps++;clearTimeout(tapT);tapT=setTimeout(()=>taps=0,2500);
  if(taps>=7){taps=0;preview=!preview;store.set('adv-preview',preview?'1':'0');render();toast(preview?'미리보기 모드 켜짐':'미리보기 모드 꺼짐')}});

/* 눈 */
let s=7;const rnd=()=>(s=s*16807%2147483647)/2147483647;
$('snow').innerHTML=Array.from({length:38},()=>`<circle class="flake" cx="${(rnd()*400).toFixed(1)}" cy="-6" r="${(1+rnd()*2).toFixed(1)}" opacity="${(.5+rnd()*.5).toFixed(2)}" style="animation-duration:${(6+rnd()*8).toFixed(1)}s;animation-delay:-${(rnd()*12).toFixed(1)}s"/>`).join('');

render();syncTime();
}
</script>
